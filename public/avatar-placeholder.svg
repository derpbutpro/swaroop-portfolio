<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="3" />

  <!-- Grid overlay for Engineering Lab feel -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Glowing Accent Ring -->
  <circle cx="200" cy="170" r="105" fill="none" stroke="url(#ringGradient)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="200" cy="170" r="95" fill="#0b1329" stroke="#10b981" stroke-width="2" />

  <!-- Abstract Coder/Student Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="140" r="42" fill="url(#accentGradient)" />
  <!-- Hair / Cap detail -->
  <path d="M162 135 C162 105, 238 105, 238 135 C225 118, 175 118, 162 135 Z" fill="#064e3b" opacity="0.8" />
  <!-- Shoulders / Torso -->
  <path d="M130 240 C130 195, 160 195, 200 195 C240 195, 270 195, 270 240 Z" fill="url(#accentGradient)" opacity="0.9" />

  <!-- Terminal / Code brackets around avatar -->
  <text x="75" y="180" font-family="monospace" font-size="34" font-weight="bold" fill="#34d399" opacity="0.8">&lt;/&gt;</text>
  <text x="300" y="180" font-family="monospace" font-size="34" font-weight="bold" fill="#34d399" opacity="0.8">{ ; }</text>

  <!-- Bottom Badge: Swaroop Bevinal -->
  <rect x="50" y="300" width="300" height="52" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
  <text x="200" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">
    SWAROOP BEVINAL
  </text>
  <text x="200" y="342" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#34d399">
    CSE @ BITian • Code &amp; Logic
  </text>

  <!-- Status indicator dot (active/learning) -->
  <circle cx="330" cy="315" r="5" fill="#10b981" />
  <circle cx="330" cy="315" r="8" fill="none" stroke="#34d399" opacity="0.5" />
</svg>
